[package]
name = "fedzk-zk"
version = "0.1.0"
edition = "2021"
description = "FEDzk Phase3 verify-first sidecar (snarkjs-shaped fedzk.proof.v1)"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
ark-bn254 = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-groth16 = "0.4"
ark-serialize = "0.4"
ark-snark = "0.4"
ark-std = "0.4"
clap = { version = "4", features = ["derive"] }
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
